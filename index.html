<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMU Canteen | Poster Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #f1f5f9;
            --text-dark: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-base);
            color: var(--text-dark);
            min-height: 100vh;
        }

        .header {
            padding: 60px 20px 40px;
            text-align: center;
            background: #fff;
            border-bottom: 2px solid #000;
        }

        .header h1 {
            font-size: clamp(40px, 12vw, 80px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -4px;
            line-height: 0.8;
            color: #000;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
            width: 100%;
        }

        /* Цветовые схемы для карточек */
        .card-pink { --card-bg: #ec4899; --accent: #fbcfe8; }
        .card-yellow { --card-bg: #eab308; --accent: #fef9c3; }
        .card-indigo { --card-bg: #6366f1; --accent: #e0e7ff; }
        .card-green { --card-bg: #22c55e; --accent: #dcfce7; }
        .card-orange { --card-bg: #f97316; --accent: #ffedd5; }
        .card-red { --card-bg: #ef4444; --accent: #fee2e2; }

        .menu-card {
            background: var(--card-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 25px;
            color: #fff;
            position: relative;
            overflow: hidden;
            border-bottom: 2px solid #000;
        }

        .item-name {
            font-size: clamp(48px, 15vw, 90px);
            font-weight: 900;
            text-transform: uppercase;
            line-height: 0.85;
            letter-spacing: -3px;
            z-index: 2;
            margin-bottom: 20px;
            word-break: break-word;
        }

        .img-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .item-img {
            width: 85%;
            max-height: 60vh;
            object-fit: contain;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.3));
            transform: rotate(-5deg);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .menu-card:hover .item-img {
            transform: rotate(0deg) scale(1.05);
        }

        .item-footer {
            z-index: 2;
            margin-top: 30px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 3px solid #fff;
            padding-top: 20px;
            margin-bottom: 15px;
        }

        .price-row .vol {
            font-size: 20px;
            font-weight: 700;
            opacity: 0.9;
        }

        .price-row .amt {
            font-size: 32px;
            font-weight: 900;
        }

        /* Плавные переходы */
        .menu-card {
            animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes slideUp {
            from { transform: translateY(100vh); }
            to { transform: translateY(0); }
        }

        /* Десктопная версия (сетка) */
        @media (min-width: 768px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
            .menu-card {
                min-height: 80vh;
                border-right: 2px solid #000;
            }
        }

        .loader {
            position: fixed;
            inset: 0;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 24px;
            letter-spacing: 5px;
            z-index: 100;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <div id="loader" class="loader">BMU LOADING...</div>

    <header class="header">
        <h1>BMU<br>CANTEEN</h1>
    </header>

    <main class="container" id="menu-container"></main>

    <script>
        const SHEET_ID = '1GqqzNX3FQlyi61DO93hkc-Z_Iw5RcJJXmvANP8LC8rA';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

        const colors = ['card-pink', 'card-yellow', 'card-indigo', 'card-green', 'card-orange', 'card-red'];

        async function initMenu() {
            try {
                const res = await fetch(CSV_URL);
                const data = await res.text();
                const rows = data.split('\n').map(r => r.trim()).filter(r => r.length > 0);
                
                const container = document.getElementById('menu-container');
                const loader = document.getElementById('loader');
                container.innerHTML = '';

                const hasRealData = rows.some(r => !r.includes('Название') && !r.includes('Столбец') && r.split(',').length > 1);
                
                const menuToRender = hasRealData ? rows : [
                    ',Лимонад,350мл - 20.000 / 500мл - 25.000 / 700мл - 30.000,https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?q=80&w=600&auto=format&fit=crop',
                    ',Айсти,350мл - 25.000 / 500мл - 30.000 / 700мл - 35.000,https://images.unsplash.com/photo-1499638673689-79a0b5115d87?q=80&w=600&auto=format&fit=crop',
                    ',Горячий чай,400мл - 25.000 / 500мл - 30.000,https://images.unsplash.com/photo-1544145945-f904253d0c7b?q=80&w=600&auto=format&fit=crop'
                ];

                menuToRender.forEach((row, index) => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                    if (cols.filter(c => c.length > 0).length < 2) return;
                    if (row.includes('Название') || row.includes('Столбец')) return;

                    const name = cols[1] || cols[0];
                    const prices = cols[2] || cols[1];
                    const img = cols[3] || cols[2] || '';

                    function getDirectDriveLink(link) {
                        if (link.includes('drive.google.com')) {
                            const match = link.match(/\/d\/([^/]+)/) || link.match(/id=([^&]+)/);
                            if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`;
                        }
                        return link;
                    }

                    const displayImg = (img && img.startsWith('http')) ? getDirectDriveLink(img) : '';
                    const colorClass = colors[index % colors.length];

                    const section = document.createElement('section');
                    section.className = `menu-card ${colorClass}`;
                    section.style.animationDelay = `${index * 0.2}s`;
                    
                    section.innerHTML = `
                        <h2 class="item-name">${name}</h2>
                        <div class="img-container">
                            ${displayImg ? `<img src="${displayImg}" class="item-img" alt="${name}">` : ''}
                        </div>
                        <div class="item-footer">
                            ${prices.split('/').map(p => {
                                const parts = p.split('-');
                                const vol = parts[0] ? parts[0].trim() : '';
                                const prc = parts[1] ? parts[1].trim() : '';
                                if(!vol && !prc) return '';
                                return `
                                    <div class="price-row">
                                        <span class="vol">${vol}</span>
                                        <span class="amt">${prc}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                    container.appendChild(section);
                });

                loader.style.display = 'none';

            } catch (e) {
                console.error(e);
                document.getElementById('loader').innerText = 'ERROR LOADING';
            }
        }

        initMenu();
    </script>
</body>

</html>
