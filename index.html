<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMU Canteen | Clean Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light: #f8fafc;
            --accent-blue: #0284c7;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-light);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.5;
        }

        .header {
            padding: 50px 20px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: clamp(32px, 8vw, 48px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-main);
            position: relative;
            display: inline-block;
        }

        .header h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background: var(--accent-blue);
            border-radius: 2px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .menu-card {
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0,0,0,0.03);
            animation: fadeIn 0.8s ease-out both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.1);
        }

        .img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #f1f5f9;
            position: relative;
        }

        .item-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .menu-card:hover .item-img {
            transform: scale(1.08);
        }

        .content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .item-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .price-list {
            margin-top: auto;
            display: grid;
            gap: 8px;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: 12px;
            transition: background 0.3s ease;
        }

        .menu-card:hover .price-item {
            background: #f1f5f9;
        }

        .vol {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .amt {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .loader {
            position: fixed;
            inset: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Адаптив для мобильных */
        @media (max-width: 640px) {
            .container {
                grid-template-columns: 1fr;
                padding: 15px;
            }
            .header { padding-top: 30px; }
        }
    </style>
</head>

<body>

    <div id="loader" class="loader">
        <div class="spinner"></div>
    </div>

    <header class="header">
        <h1>BMU CANTEEN</h1>
    </header>

    <main class="container" id="menu-container"></main>

    <script>
        const SHEET_ID = '1GqqzNX3FQlyi61DO93hkc-Z_Iw5RcJJXmvANP8LC8rA';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

        async function initMenu() {
            try {
                const res = await fetch(CSV_URL);
                const data = await res.text();
                const rows = data.split('\n').map(r => r.trim()).filter(r => r.length > 0);
                
                const container = document.getElementById('menu-container');
                const loader = document.getElementById('loader');
                container.innerHTML = '';

                const hasRealData = rows.some(r => !r.includes('Название') && !r.includes('Столбец') && r.split(',').length > 1);
                
                const menuToRender = hasRealData ? rows : [
                    ',Лимонад,350мл - 20.000 / 500мл - 25.000 / 700мл - 30.000,https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?q=80&w=600&auto=format&fit=crop',
                    ',Айсти,350мл - 25.000 / 500мл - 30.000 / 700мл - 35.000,https://images.unsplash.com/photo-1499638673689-79a0b5115d87?q=80&w=600&auto=format&fit=crop',
                    ',Горячий чай,400мл - 25.000 / 500мл - 30.000,https://images.unsplash.com/photo-1544145945-f904253d0c7b?q=80&w=600&auto=format&fit=crop'
                ];

                menuToRender.forEach((row, index) => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                    if (cols.filter(c => c.length > 0).length < 2) return;
                    if (row.includes('Название') || row.includes('Столбец')) return;

                    const name = cols[1] || cols[0];
                    const prices = cols[2] || cols[1];
                    const img = cols[3] || cols[2] || '';

                    function getDirectDriveLink(link) {
                        if (link.includes('drive.google.com')) {
                            const match = link.match(/\/d\/([^/]+)/) || link.match(/id=([^&]+)/);
                            if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`;
                        }
                        return link;
                    }

                    const displayImg = (img && img.startsWith('http')) ? getDirectDriveLink(img) : 'https://images.unsplash.com/photo-1544145945-f904253d0c7b?q=80&w=400&auto=format&fit=crop';

                    const card = document.createElement('div');
                    card.className = 'menu-card';
                    card.style.animationDelay = `${index * 0.1}s`;
                    
                    card.innerHTML = `
                        <div class="img-wrapper">
                            <img src="${displayImg}" class="item-img" alt="${name}" loading="lazy">
                        </div>
                        <div class="content">
                            <h2 class="item-name">${name}</h2>
                            <div class="price-list">
                                ${prices.split('/').map(p => {
                                    const parts = p.split('-');
                                    const vol = parts[0] ? parts[0].trim() : '';
                                    const prc = parts[1] ? parts[1].trim() : '';
                                    if(!vol && !prc) return '';
                                    return `
                                        <div class="price-item">
                                            <span class="vol">${vol}</span>
                                            <span class="amt">${prc}</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);

            } catch (e) {
                console.error(e);
                document.getElementById('loader').innerHTML = 'Error loading menu';
            }
        }

        initMenu();
    </script>
</body>

</html>
