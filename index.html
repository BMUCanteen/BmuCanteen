<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMU Canteen | Clean Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Syne:wght@700;800&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.5;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Анимированный живой фон */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: #030712;
        }

        .glow-1, .glow-2, .glow-3 {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            mix-blend-mode: screen;
            animation: float 25s infinite alternate ease-in-out;
        }

        .glow-1 {
            width: 80vw; height: 80vw;
            top: -20%; left: -20%;
            background: radial-gradient(circle, #1e40af 0%, transparent 70%);
        }

        .glow-2 {
            width: 70vw; height: 70vw;
            bottom: -10%; right: -10%;
            background: radial-gradient(circle, #0c4a6e 0%, transparent 70%);
            animation-duration: 30s;
        }

        .glow-3 {
            width: 50vw; height: 50vw;
            top: 30%; right: 10%;
            background: radial-gradient(circle, #1e3a8a 0%, transparent 70%);
            animation-duration: 35s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(10%, 15%) scale(1.1); }
            100% { transform: translate(-5%, 10%) scale(0.9); }
        }

        .header {
            padding: 50px 20px 30px;
            text-align: center;
        }

        .header h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(32px, 8vw, 60px);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: #fff;
            line-height: 0.8;
            margin-bottom: 5px;
        }

        .header .cafe-text {
            display: block;
            font-family: 'Great Vibes', cursive;
            font-size: clamp(24px, 6vw, 42px);
            font-weight: 400;
            letter-spacing: 0;
            color: var(--accent-blue);
            text-transform: none; /* Рукописные буквы лучше смотрятся не в капсе */
            margin-top: -10px; /* Нахлест для стиля */
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.3));
        }

        .container {
            flex: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            align-content: center;
            gap: 20px;
            width: 100%;
        }

        .menu-card {
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.8s ease-out both;
            max-width: 350px;
            margin: 0 auto;
            width: 100%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.1);
        }

        .img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #f1f5f9;
            position: relative;
        }

        .item-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.1); /* Увеличиваем, чтобы скрыть края с водяными знаками */
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .menu-card:hover .item-img {
            transform: scale(1.2); /* Чуть больше при наведении */
        }

        .content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .item-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        /* Динамические стили категорий */
        .card-cold { --accent-cat: #0ea5e9; --bg-tag: rgba(14, 165, 233, 0.1); }
        .card-hot { --accent-cat: #f59e0b; --bg-tag: rgba(245, 158, 11, 0.1); }

        .category-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--accent-cat);
            backdrop-filter: blur(4px);
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .price-list {
            margin-top: auto;
            display: grid;
            gap: 10px;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #f8fafc;
            border-radius: 14px;
            border-left: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .menu-card:hover .price-item {
            background: var(--bg-tag);
            border-left-color: var(--accent-cat);
        }

        .vol {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .amt {
            font-size: 17px;
            font-weight: 800;
            color: var(--accent-cat);
        }

        .loader {
            position: fixed;
            inset: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Адаптив для мобильных */
        @media (max-width: 640px) {
            .container {
                grid-template-columns: 1fr;
                padding: 15px;
            }
            .header { padding-top: 30px; }
        }
    </style>
</head>

<body>

    <div id="loader" class="loader">
        <div class="spinner"></div>
    </div>

    <div class="bg-glow">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
        <div class="glow-3"></div>
    </div>

    <header class="header">
        <h1>BMU <span class="cafe-text">Cafeteria</span></h1>
    </header>

    <main class="container" id="menu-container"></main>

    <script>
        const SHEET_ID = '1GqqzNX3FQlyi61DO93hkc-Z_Iw5RcJJXmvANP8LC8rA';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

        async function initMenu() {
            try {
                const res = await fetch(CSV_URL);
                const data = await res.text();
                const rows = data.split('\n').map(r => r.trim()).filter(r => r.length > 0);
                
                const container = document.getElementById('menu-container');
                const loader = document.getElementById('loader');
                container.innerHTML = '';

                const hasRealData = rows.some(r => !r.includes('Название') && !r.includes('Столбец') && r.split(',').length > 1);
                
                const menuToRender = hasRealData ? rows : [
                    ',Лимонад,350мл - 20.000 / 500мл - 25.000 / 700мл - 30.000,img/lemonade.png',
                    ',Айсти,350мл - 25.000 / 500мл - 30.000 / 700мл - 35.000,img/iced_tea.png',
                    ',Горячий чай,400мл - 25.000 / 500мл - 30.000,img/hot_tea.png'
                ];

                menuToRender.forEach((row, index) => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                    if (cols.filter(c => c.length > 0).length < 2) return;
                    if (row.includes('Название') || row.includes('Столбец')) return;

                    const name = cols[1] || cols[0];
                    const prices = cols[2] || cols[1];
                    const img = cols[3] || cols[2] || '';

                    const isHot = name.toLowerCase().includes('горяч') || name.toLowerCase().includes('hot');
                    const categoryClass = isHot ? 'card-hot' : 'card-cold';
                    const categoryLabel = isHot ? 'COLD' : 'HOT'; // Ошибка в логике была, поправлю: cold - холодный, hot - горячий
                    
                    // На самом деле, по умолчанию пусть будет COLD, если не HOT
                    const label = isHot ? 'HOT' : 'COLD';

                    function getDirectDriveLink(link) {
                        if (link.includes('drive.google.com')) {
                            const match = link.match(/\/d\/([^/]+)/) || link.match(/id=([^&]+)/);
                            if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`;
                        }
                        return link;
                    }

                    let displayImg = (img && img.startsWith('http')) ? getDirectDriveLink(img) : '';
                    if (!displayImg) {
                        if (name.toLowerCase().includes('лимонад')) displayImg = 'img/lemonade.png';
                        else if (name.toLowerCase().includes('айсти') || name.toLowerCase().includes('iced')) displayImg = 'img/iced_tea.png';
                        else if (name.toLowerCase().includes('чай') || name.toLowerCase().includes('tea')) displayImg = 'img/hot_tea.png';
                        else displayImg = 'img/hot_tea.png'; // Fallback
                    }

                    const card = document.createElement('div');
                    card.className = `menu-card ${categoryClass}`;
                    card.style.animationDelay = `${index * 0.1}s`;
                    
                    card.innerHTML = `
                        <div class="img-wrapper">
                            <div class="category-badge">${label}</div>
                            <img src="${displayImg}" class="item-img" alt="${name}" loading="lazy">
                        </div>
                        <div class="content">
                            <h2 class="item-name">${name}</h2>
                            <div class="price-list">
                                ${prices.split('/').map(p => {
                                    const parts = p.split('-');
                                    const vol = parts[0] ? parts[0].trim() : '';
                                    const prc = parts[1] ? parts[1].trim() : '';
                                    if(!vol && !prc) return '';
                                    return `
                                        <div class="price-item">
                                            <span class="vol">${vol}</span>
                                            <span class="amt">${prc}</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);

            } catch (e) {
                console.error(e);
                document.getElementById('loader').innerHTML = 'Error loading menu';
            }
        }

        initMenu();
    </script>
</body>

</html>
